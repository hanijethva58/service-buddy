<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Service – Service Buddy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Common CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">Service Buddy</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="book.html">Book Service</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="services">
  <h2>Book a Service</h2>

  <div class="service-grid">

    <div class="card">
      <h3>Service Booking Form</h3>

      <form onsubmit="bookService(event)" class="booking-form">
  <input type="text" placeholder="Full Name" required>
  <input type="tel" placeholder="Mobile Number" required>

  <select required>
    <option value="">Select Service</option>
    <option>Electrician</option>
    <option>Plumber</option>
    <option>AC Repair</option>
    <option>Home Cleaning</option>
  </select>

  <input type="text" placeholder="Service Address" required>
  <input type="date" required>
  <input type="time" required>

  <button type="submit">Confirm Booking</button>
</form>

    </div>

  </div>
</section>

<footer>
  © 2026 Service Buddy | Home Services Website
</footer>

<!-- ✅ Common JS -->
<script src="js/script.js"></script>
</body>
</html>
